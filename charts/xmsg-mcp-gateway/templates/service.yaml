{{- if .Values.gateway.podNetwork }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gw.fullname" . }}
  labels:
    {{- include "gw.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "gw.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ int .Values.gateway.port }}
      targetPort: http
{{- end }}
