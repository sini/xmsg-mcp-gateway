name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-reference:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 -m pip install uv==0.13.5
      - run: uv sync --locked --python 3.12 --link-mode copy
      - run: uv run --locked pytest -q
      - run: uv run --locked ruff check phase1 tests scripts
      - run: python3 scripts/timeout_diagnostics_checks.py
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Rust toolchain
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$version" --profile minimal --component rustfmt,clippy
          rustup default "$version"
      - run: cargo fmt --all -- --check
      - name: Portable live-runner diagnostics
        if: runner.os == 'macOS'
        run: python3 scripts/timeout_diagnostics_checks.py
      - name: Rust tests and completion counts
        run: |
          cargo test --locked -j 4 2>&1 | tee cargo-tests.log
          python3 - <<'PY'
          import pathlib
          import sys
          import re
          log = pathlib.Path("cargo-tests.log").read_text()
          summaries = re.findall(r"test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out", log)
          assert summaries, "no Rust test summaries"
          counts = [tuple(map(int, row)) for row in summaries]
          assert all(not row[1] and not any(row[3:]) for row in counts), "failed or filtered Rust tests"
          import json
          expected_passed, expected_ignored = json.loads(pathlib.Path("ci/ordinary-counts.json").read_text())[sys.platform]
          assert sum(row[0] for row in counts) == expected_passed, "executed Rust test count mismatch"
          assert sum(row[2] for row in counts) == expected_ignored, "private-node deferral count mismatch"
          print(f"Rust test completion guard: {expected_passed} passed; {expected_ignored} private-node cases run in mandatory transport/custody job")
          PY
      - run: cargo clippy --locked --all-targets -j 4 -- -D warnings

  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Rust toolchain
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$version" --profile minimal
          rustup default "$version"
      - name: Real private-node compatibility and provenance controls
        run: |
          python3 scripts/transport_compat.py | tee transport-compat.log
          grep -Fx 'transport-compat-complete:pinned-9-baseline-unix-4' transport-compat.log
          grep -Fx 'copied-control-cached-artifact:refused:real_xmsg' transport-compat.log
      - name: Leaf agent socket with no process metadata
        run: |
          revision=$(python3 -c 'import tomllib; print(tomllib.load(open("ci/xmsg-pin.toml", "rb"))["revision"])')
          export XMSG_GATEWAY_BIN="$PWD/.artifacts/transport/$revision/xmsg"
          python3 scripts/leaf_transport_check.py | tee leaf-transport.log
          grep -Fx 'leaf-transport-complete:normal-and-no-proc' leaf-transport.log
          grep -Fx 'leaf-transport-complete:no-proc-client-and-daemon' leaf-transport.log
      - name: Real Events custody and signed HTTPS delivery
        run: |
          revision=$(python3 -c 'import tomllib; print(tomllib.load(open("ci/xmsg-pin.toml", "rb"))["revision"])')
          export XMSG_GATEWAY_BIN="$PWD/.artifacts/transport/$revision/xmsg"
          cargo test --locked --lib serving::events_tests::real_pinned_node_custody_wakes_https_and_recovers_owned_body -- --ignored --exact --nocapture 2>&1 | tee events-transport.log
          grep -Fx 'events-transport-complete:owned-custody-https' events-transport.log
      - name: Plain MCP send receives an owned attested leaf reply
        run: |
          revision=$(python3 -c 'import tomllib; print(tomllib.load(open("ci/xmsg-pin.toml", "rb"))["revision"])')
          export XMSG_GATEWAY_BIN="$PWD/.artifacts/transport/$revision/xmsg"
          cargo test --locked --test gateway_leaf_reply mcp_leaf_send_reply_enters_owned_custody_with_attested_origin -- --ignored --exact --nocapture 2>&1 | tee gateway-leaf-reply.log
          grep -Fx 'gateway-leaf-reply-complete:mcp-owned-custody-attested-origin' gateway-leaf-reply.log
      - name: Private-node custody and completion controls
        run: |
          revision=$(python3 -c 'import tomllib; print(tomllib.load(open("ci/xmsg-pin.toml", "rb"))["revision"])')
          export XMSG_GATEWAY_BIN="$PWD/.artifacts/transport/$revision/xmsg"
          python3 scripts/custody_checks.py | tee custody-checks.log
          grep -Fx 'custody-checks-complete:23' custody-checks.log
          grep -Fx 'copied-control-cached-artifact:refused:custody_inbound' custody-checks.log
      - name: Private-node outbound custody and completion controls
        run: |
          revision=$(python3 -c 'import tomllib; print(tomllib.load(open("ci/xmsg-pin.toml", "rb"))["revision"])')
          export XMSG_GATEWAY_BIN="$PWD/.artifacts/transport/$revision/xmsg"
          python3 scripts/outbound_checks.py | tee outbound-checks.log
          grep -Fx 'outbound-checks-complete:17' outbound-checks.log
          grep -Fx 'copied-control-cached-artifact:refused:custody_outbound' outbound-checks.log
      - name: Reservation retirement with the pinned daemon
        run: |
          revision=$(python3 -c 'import tomllib; print(tomllib.load(open("ci/xmsg-pin.toml", "rb"))["revision"])')
          export XMSG_GATEWAY_BIN="$PWD/.artifacts/transport/$revision/xmsg"
          cargo test --locked --test outbound_retirement -- --ignored --nocapture 2>&1 | tee retirement-transport.log
          grep -F '3 passed; 0 failed; 0 ignored' retirement-transport.log
          grep -Fx 'outbound-retirement-complete:send-reply-cross-operation-restart' retirement-transport.log
          grep -Fx 'outbound-retirement-complete:gist-quota-reclaimed-old-id-fenced' retirement-transport.log
          grep -Fx 'outbound-retirement-complete:inflight-lease-and-outcome-preserved' retirement-transport.log
      - name: MCP startup and messaging completion controls
        run: |
          revision=$(python3 -c 'import tomllib; print(tomllib.load(open("ci/xmsg-pin.toml", "rb"))["revision"])')
          export XMSG_GATEWAY_BIN="$PWD/.artifacts/transport/$revision/xmsg"
          python3 scripts/wiring_checks.py | tee wiring-checks.log
          grep -Fx 'copied-control-cached-artifact:refused:messaging' wiring-checks.log
          grep -Fx 'wiring-checks-complete:28' wiring-checks.log
      - name: Maximum escaped send through the HTTP listener
        run: |
          revision=$(python3 -c 'import tomllib; print(tomllib.load(open("ci/xmsg-pin.toml", "rb"))["revision"])')
          export XMSG_GATEWAY_BIN="$PWD/.artifacts/transport/$revision/xmsg"
          python3 scripts/body_checks.py

  broker-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Rust toolchain
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$version" --profile minimal
          rustup default "$version"
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Enable bounded Nix builds in the runner user manager
        run: |
          ci_uid=$(id -u)
          runtime_dir="/run/user/$ci_uid"
          timeout 30s sudo -n systemctl start "user@$ci_uid.service"
          export XDG_RUNTIME_DIR="$runtime_dir"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$runtime_dir/bus"
          timeout 15s systemctl --user show-environment >/dev/null
          timeout 15s systemd-run --user --scope -q -p MemoryMax=12G /usr/bin/true
          printf 'XDG_RUNTIME_DIR=%s\nDBUS_SESSION_BUS_ADDRESS=unix:path=%s/bus\n' "$runtime_dir" "$runtime_dir" >> "$GITHUB_ENV"
      - name: Build revision-verified private-node fixtures
        run: |
          python3 scripts/transport_compat.py --build-only
          revision=$(python3 -c 'import tomllib; print(tomllib.load(open("ci/xmsg-pin.toml", "rb"))["revision"])')
          binary="$PWD/.artifacts/transport/$revision/xmsg"
          test -x "$binary"
          test "$("$binary" --version)" = "xmsg 0.1.0+$revision"
          printf 'XMSG_GATEWAY_BIN=%s\n' "$binary" >> "$GITHUB_ENV"
      - name: Real MCP leaf hub and packaged broker fixture
        run: |
          unset GENIE_ROOT
          python3 scripts/broker_bridge_e2e.py | tee broker-bridge-e2e.log
          grep -Fx 'broker-bridge-e2e-complete:mcp-leaf-hub-genie-guard-rewrite-dedup' broker-bridge-e2e.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path(".artifacts/broker-bridge-e2e/result.json").read_text())
          assert result["exit_code"] == 0
          assert result["local_genie_override"] is False, "CI must build the public pinned genie-root"
          PY

  mutation-selection:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.selection.outputs.matrix }}
      selected: ${{ steps.selection.outputs.selected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: selection
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/mutation_gates.py select --event "$EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA" --output .artifacts/mutation-plan.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-plan
          path: .artifacts/mutation-plan.json
          include-hidden-files: true
          if-no-files-found: error

  mutation-suite:
    needs: mutation-selection
    if: needs.mutation-selection.outputs.selected != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.mutation-selection.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Rust toolchain
        if: ${{ !matrix.python }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$version" --profile minimal
          rustup default "$version"
      - name: Install pinned Python reference dependencies
        if: matrix.python
        run: |
          python3 -m pip install uv==0.13.5
          uv sync --locked --python 3.12 --link-mode copy
      - name: Prepare existing revision-verified daemon fixtures
        if: matrix.fixture
        run: |
          python3 scripts/transport_compat.py --build-only
          revision=$(python3 -c 'import tomllib; print(tomllib.load(open("ci/xmsg-pin.toml", "rb"))["revision"])')
          printf 'XMSG_GATEWAY_BIN=%s/.artifacts/transport/%s/xmsg\nXMSG_GATEWAY_REVISION=%s\n' "$PWD" "$revision" "$revision" >> "$GITHUB_ENV"
      - name: Complete selected suite with its controls
        env:
          SUITE: ${{ matrix.suite }}
          PYTHON_REFERENCE: ${{ matrix.python }}
        run: |
          if [ "$PYTHON_REFERENCE" = true ]; then
            uv run --locked python scripts/mutation_gates.py run "$SUITE" --output .artifacts/mutation-receipts
          else
            python3 scripts/mutation_gates.py run "$SUITE" --output .artifacts/mutation-receipts
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mutation-receipt-${{ matrix.suite }}
          path: .artifacts/mutation-receipts/
          include-hidden-files: true
          if-no-files-found: error

  mutation-completion:
    needs: [mutation-selection, mutation-suite]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mutation-plan
          path: .artifacts/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.mutation-selection.outputs.selected != '0'
        with:
          pattern: mutation-receipt-*
          path: .artifacts/mutation-receipts/
          merge-multiple: true
      - name: Validate selected execution receipts and full inventory
        env:
          SELECTION_RESULT: ${{ needs.mutation-selection.result }}
          SUITE_RESULT: ${{ needs.mutation-suite.result }}
          SELECTED: ${{ needs.mutation-selection.outputs.selected }}
        run: |
          test "$SELECTION_RESULT" = success
          if [ "$SELECTED" != 0 ]; then test "$SUITE_RESULT" = success; fi
          mkdir -p .artifacts/mutation-receipts
          python3 scripts/mutation_gates.py verify --plan .artifacts/mutation-plan.json --receipts .artifacts/mutation-receipts
