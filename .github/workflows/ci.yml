name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  python-reference:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 -m pip install uv==0.13.5
      - run: uv sync --locked --python 3.12 --link-mode copy
      - run: uv run --locked pytest -q
      - run: uv run --locked ruff check phase1 tests scripts
      - run: uv run --locked python scripts/mutations.py
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Rust toolchain
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$version" --profile minimal --component rustfmt,clippy
          rustup default "$version"
      - run: cargo fmt --all -- --check
      - name: Rust tests and completion counts
        run: |
          cargo test --locked -j 4 2>&1 | tee cargo-tests.log
          python3 - <<'PY'
          import pathlib
          import sys
          import re
          log = pathlib.Path("cargo-tests.log").read_text()
          summaries = re.findall(r"test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out", log)
          assert summaries, "no Rust test summaries"
          counts = [tuple(map(int, row)) for row in summaries]
          assert all(not row[1] and not any(row[3:]) for row in counts), "failed or filtered Rust tests"
          expected_passed, expected_ignored = (66, 58) if sys.platform == "linux" else (65, 0)
          assert sum(row[0] for row in counts) == expected_passed, "executed Rust test count mismatch"
          assert sum(row[2] for row in counts) == expected_ignored, "private-node deferral count mismatch"
          print(f"Rust test completion guard: {expected_passed} passed; {expected_ignored} private-node cases run in mandatory transport/custody job")
          PY
      - run: cargo clippy --locked --all-targets -j 4 -- -D warnings
      - name: Grant source mutants
        if: runner.os == 'Linux'
        run: python3 scripts/grant_mutants.py
      - name: Identity boundary source mutants
        if: runner.os == 'Linux'
        run: python3 scripts/identity_mutants.py
      - name: Serving misuse source mutants
        if: runner.os == 'Linux'
        run: python3 scripts/serving_mutants.py

  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Rust toolchain
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$version" --profile minimal
          rustup default "$version"
      - name: Real private-node compatibility and provenance controls
        run: |
          python3 scripts/transport_compat.py | tee transport-compat.log
          grep -Fx 'transport-compat-complete:pinned-9-baseline-unix-4' transport-compat.log
          grep -Fx 'copied-control-cached-artifact:refused:real_xmsg' transport-compat.log
      - name: Isolated federation admission source mutants
        run: |
          python3 scripts/transport_mutants.py | tee transport-mutants.log
          grep -Fx 'transport-admission-mutants-complete:4/4' transport-mutants.log

      - name: Private-node custody and completion controls
        run: |
          revision=$(python3 -c 'import tomllib; print(tomllib.load(open("ci/xmsg-pin.toml", "rb"))["revision"])')
          export XMSG_GATEWAY_BIN="$PWD/.artifacts/transport/$revision/xmsg"
          python3 scripts/custody_checks.py | tee custody-checks.log
          grep -Fx 'custody-checks-complete:18' custody-checks.log
          grep -Fx 'copied-control-cached-artifact:refused:custody_inbound' custody-checks.log
      - name: Custody source mutants
        run: |
          revision=$(python3 -c 'import tomllib; print(tomllib.load(open("ci/xmsg-pin.toml", "rb"))["revision"])')
          export XMSG_GATEWAY_BIN="$PWD/.artifacts/transport/$revision/xmsg"
          python3 scripts/custody_mutants.py | tee custody-mutants.log
          grep -Fx 'custody-mutants-complete:29' custody-mutants.log
      - name: Private-node outbound custody and completion controls
        run: |
          revision=$(python3 -c 'import tomllib; print(tomllib.load(open("ci/xmsg-pin.toml", "rb"))["revision"])')
          export XMSG_GATEWAY_BIN="$PWD/.artifacts/transport/$revision/xmsg"
          python3 scripts/outbound_checks.py | tee outbound-checks.log
          grep -Fx 'outbound-checks-complete:17' outbound-checks.log
          grep -Fx 'copied-control-cached-artifact:refused:custody_outbound' outbound-checks.log
      - name: Outbound custody source mutants
        run: |
          revision=$(python3 -c 'import tomllib; print(tomllib.load(open("ci/xmsg-pin.toml", "rb"))["revision"])')
          export XMSG_GATEWAY_BIN="$PWD/.artifacts/transport/$revision/xmsg"
          python3 scripts/outbound_mutants.py | tee outbound-mutants.log
          grep -Fx 'outbound-schema-floor-control:passed' outbound-mutants.log
          grep -Fx 'outbound-mutants-complete:36' outbound-mutants.log
      - name: MCP startup and messaging completion controls
        run: |
          revision=$(python3 -c 'import tomllib; print(tomllib.load(open("ci/xmsg-pin.toml", "rb"))["revision"])')
          export XMSG_GATEWAY_BIN="$PWD/.artifacts/transport/$revision/xmsg"
          python3 scripts/wiring_checks.py | tee wiring-checks.log
          grep -Fx 'copied-control-cached-artifact:refused:messaging' wiring-checks.log
          grep -Fx 'wiring-checks-complete:15' wiring-checks.log
      - name: MCP wiring source mutants
        run: |
          revision=$(python3 -c 'import tomllib; print(tomllib.load(open("ci/xmsg-pin.toml", "rb"))["revision"])')
          export XMSG_GATEWAY_BIN="$PWD/.artifacts/transport/$revision/xmsg"
          python3 scripts/wiring_mutants.py | tee wiring-mutants.log
          grep -Fx 'wiring-mutants-complete:23' wiring-mutants.log
