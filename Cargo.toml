[package]
name = "xmsg-mcp-gateway"
version = "0.2.0"
edition = "2021"
rust-version = "1.95"
description = "Durable authorization core for the xmsg MCP gateway"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.17"
