[package]
name = "xmsg-mcp-gateway"
version = "0.2.0"
edition = "2021"
rust-version = "1.95"
description = "Durable authorization core for the xmsg MCP gateway"
license = "MIT"

[dependencies]
libc = "0.2"
sha2 = "0.10"
xmsg = { git = "https://github.com/sini/xmsg", rev = "2d76fd63f4ebc63946a9303c7019a50d169f7ed3", default-features = false, features = ["client"] }
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
axum = "0.8"
tokio = { version = "1", features = ["rt", "net", "time", "macros", "signal", "process", "io-util", "sync"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3.17"
trybuild = "1.0"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tower = { version = "0.5", features = ["util"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
